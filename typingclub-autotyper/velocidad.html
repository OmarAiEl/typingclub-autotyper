<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Velocidad de pulsación</title>
<link rel="stylesheet" href="velocidad.css" />
</head>
<body>
  <h1>Elige la velocidad</h1>
  <p class="subtitulo">Rendimiento de un alumno de CFGS ADI · se ejecuta al elegir</p>

  <div class="barra" id="barra">
    <button class="segmento seg-bajo" data-nivel="bajo">
      <span class="nombre">Bajo</span>
    </button>
    <button class="segmento seg-medio" data-nivel="medio">
      <span class="nombre">Medio</span>
    </button>
    <button class="segmento seg-alto" data-nivel="alto">
      <span class="nombre">Alto</span>
    </button>
    <button class="segmento seg-sobrehumano" data-nivel="sobrehumano">
      <span class="nombre">Sobrehumano</span>
    </button>
  </div>

  <div class="ficha" id="ficha">
    <div class="ficha-titulo" id="ficha-titulo">&nbsp;</div>
    <div class="ficha-rango" id="ficha-rango">&nbsp;</div>
    <div class="ficha-desc" id="ficha-desc">&nbsp;</div>
  </div>

  <script src="velocidad.js"></script>
</body>
</html>
